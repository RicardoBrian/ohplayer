<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OhPlayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:
    radial-gradient(at 18% 18%, #e7ecff 0%, transparent 52%),
    radial-gradient(at 82% 12%, #ffe7f2 0%, transparent 46%),
    radial-gradient(at 65% 88%, #e0f5ff 0%, transparent 52%),
    radial-gradient(at 8% 92%, #eee6ff 0%, transparent 44%),
    #f4f5fa;
  --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.48);
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.74);
  --glass-nav:rgba(255,255,255,.62); --blur:saturate(180%) blur(22px);
  --text:#1a1c22; --text-2:#5b606b; --text-3:#8a8f99;
  --accent:#0071e3; --accent-hover:#0a84ff; --accent-light:rgba(0,113,227,.12);
  --accent-grad:linear-gradient(180deg,#3a9bff 0%,#0071e3 100%);
  --danger:#ff3b30; --danger-light:rgba(255,59,48,.12);
  --success:#34c759; --success-light:rgba(52,199,89,.16);
  --border:rgba(255,255,255,.55); --hairline:rgba(0,0,0,.06);
  --highlight:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.4);
  --shadow-sm:0 2px 8px rgba(40,60,130,.08); --shadow:0 10px 30px rgba(40,60,130,.12);
  --shadow-md:0 18px 50px rgba(40,60,130,.16);
  --radius:20px; --radius-sm:13px; --radius-lg:26px; --radius-pill:980px; --nav-h:56px;
  --ease:cubic-bezier(.4,0,.2,1); --dur:.26s;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",system-ui,sans-serif;
}
body.dark{
  --bg:
    radial-gradient(at 18% 18%, #1b2444 0%, transparent 55%),
    radial-gradient(at 82% 12%, #2c1a44 0%, transparent 48%),
    radial-gradient(at 65% 90%, #0e2438 0%, transparent 52%),
    radial-gradient(at 8% 92%, #1a1530 0%, transparent 46%),
    #07080d;
  --surface:rgba(44,46,58,.58); --surface-2:rgba(58,60,74,.46);
  --glass:rgba(40,42,54,.52); --glass-strong:rgba(54,56,70,.74); --glass-nav:rgba(20,21,28,.62);
  --text:#f2f4f8; --text-2:#aab0bd; --text-3:#7e848f;
  --accent:#0a84ff; --accent-hover:#409cff; --accent-light:rgba(10,132,255,.18);
  --accent-grad:linear-gradient(180deg,#2b95ff 0%,#0a84ff 100%);
  --danger:#ff453a; --danger-light:rgba(255,69,58,.18);
  --success:#30d158; --success-light:rgba(48,209,88,.2);
  --border:rgba(255,255,255,.14); --hairline:rgba(255,255,255,.08);
  --highlight:inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 .5px rgba(255,255,255,.06);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5);
  --shadow-md:0 18px 50px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); background-attachment:fixed; color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}

/* ── Nav ── */
.nav{
  position:sticky; top:0; z-index:200; height:var(--nav-h);
  display:flex; align-items:center; gap:12px; padding:0 20px;
  background:var(--glass-nav); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--hairline); box-shadow:0 1px 0 rgba(255,255,255,.4);
}
.brand{font-weight:800; font-size:1.05rem; letter-spacing:-.02em;}
.brand b{background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.nav-end{margin-left:auto; display:flex; align-items:center; gap:10px;}
.dark-toggle{
  width:44px; height:26px; border-radius:var(--radius-pill);
  background:var(--glass-strong); border:1px solid var(--border);
  cursor:pointer; position:relative; transition:background var(--dur) var(--ease);
  box-shadow:var(--highlight);
}
body.dark .dark-toggle{background:var(--accent); border-color:transparent;}
.dark-toggle::after{
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform var(--dur) var(--ease);
}
body.dark .dark-toggle::after{transform:translateX(18px);}

/* ── Layout ── */
.wrap{max-width:860px; margin:0 auto; padding:32px 20px 80px;}

/* ── Card ── */
.card{
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border); border-radius:var(--radius); padding:22px;
  box-shadow:var(--highlight),var(--shadow);
}
.card + .card{margin-top:14px;}
.card-title{font-size:.78rem; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;}

/* ── Button ── */
.btn{
  font-family:inherit; font-size:.92rem; font-weight:600; cursor:pointer;
  border-radius:var(--radius-pill); padding:10px 22px;
  border:1px solid var(--border); background:var(--glass); color:var(--text);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--highlight),var(--shadow-sm);
  transition:background var(--dur) var(--ease), transform .08s var(--ease), filter var(--dur) var(--ease);
  white-space:nowrap;
}
.btn:hover{background:var(--glass-strong);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:3px solid var(--accent-light); outline-offset:2px;}
.btn.accent{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:var(--highlight),0 6px 18px rgba(0,113,227,.35);}
.btn.accent:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent; box-shadow:none; backdrop-filter:none;}
.btn.ghost:hover{background:var(--accent-light); color:var(--accent);}
.btn.danger{color:var(--danger); background:var(--danger-light); border-color:transparent; box-shadow:none; backdrop-filter:none;}
.btn.sm{padding:6px 15px; font-size:.82rem;}
.btn.icon-btn{padding:7px 11px; font-size:1.1rem; line-height:1;}

/* ── Input ── */
.inp-row{display:flex; gap:8px; align-items:stretch;}
.inp{
  flex:1; padding:11px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--glass-strong);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  color:var(--text); font-family:inherit; font-size:.95rem; outline:none;
  box-shadow:var(--highlight);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.inp::placeholder{color:var(--text-3);}
.inp:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-light);}
.inp.narrow{flex:0 0 100px;}
input[type="file"].inp{cursor:pointer; padding:8px 14px;}
input[type="file"].inp::file-selector-button{
  background:var(--glass); border:1px solid var(--border); border-radius:8px;
  color:var(--text-2); cursor:pointer; font-size:.8rem; margin-right:10px; padding:4px 10px;
  font-family:inherit;
}

/* ── Badge ── */
.badge{display:inline-block; font-size:.7rem; font-weight:700; padding:2px 9px; border-radius:var(--radius-pill);}
.badge.accent{background:var(--accent-light); color:var(--accent);}
.badge.success{background:var(--success-light); color:var(--success);}
.badge.muted{background:var(--hairline); color:var(--text-3);}

/* ── Subtitle list ── */
.sub-list{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
.sub-item{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-2); border:1px solid var(--hairline);
  border-radius:var(--radius-sm); padding:8px 12px; font-size:.85rem;
}
.sub-item .sub-label{flex:1; color:var(--text-2); font-weight:500;}
.sub-item .sub-active{display:none; font-size:.7rem;}
.sub-item.is-active .sub-active{display:inline;}
.sub-rm{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:1rem; padding:0 2px; transition:color var(--dur);}
.sub-rm:hover{color:var(--danger);}

/* ── Player area ── */
#player-section{display:none;}
#player-section.visible{display:block; margin-top:14px;}

.player-wrap{
  position:relative; width:100%; padding-bottom:56.25%; /* 16:9 */
  background:#000; border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow-md);
}
.player-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:none;}

/* Subtitle overlay */
.sub-overlay{
  position:absolute; bottom:64px; left:50%; transform:translateX(-50%);
  width:90%; max-width:700px; text-align:center; pointer-events:none; z-index:10;
}
.sub-text{
  display:inline-block; max-width:100%;
  background:rgba(0,0,0,.72); color:#fff;
  font-size:1.15rem; font-weight:500; line-height:1.55;
  padding:6px 18px; border-radius:10px;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  white-space:pre-wrap; word-break:keep-all;
}
.sub-text:empty{display:none;}

/* ── Sync controls ── */
.sync-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:12px; padding:14px 18px;
  background:var(--surface-2); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--hairline); border-radius:var(--radius-sm);
}
.sync-time{
  font-size:1.2rem; font-weight:700; letter-spacing:.02em;
  font-variant-numeric:tabular-nums; color:var(--accent); min-width:68px;
}
.sync-bar .sep{color:var(--text-3); font-size:.85rem;}
.track-pills{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
.track-pill{
  font-size:.8rem; font-weight:600; padding:5px 13px;
  border-radius:var(--radius-pill); border:1px solid var(--border);
  background:var(--glass); color:var(--text-2); cursor:pointer;
  transition:all var(--dur) var(--ease);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
.track-pill:hover{background:var(--glass-strong); color:var(--text);}
.track-pill.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:0 3px 10px rgba(0,113,227,.3);}

/* ── Hint ── */
.hint{font-size:.78rem; color:var(--text-3); margin-top:8px; line-height:1.55;}
.hint a{color:var(--accent); text-decoration:none;}
.hint a:hover{text-decoration:underline;}
.hint strong{color:var(--text-2);}

/* ── Error ── */
.err{
  background:var(--danger-light); border:1px solid rgba(255,59,48,.22);
  border-radius:var(--radius-sm); color:var(--danger);
  font-size:.85rem; padding:10px 14px; margin-top:10px; display:none;
}
.err.show{display:block;}

/* ── Toast ── */
.toast{
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(28,28,30,.82); color:#fff; font-size:.88rem; font-weight:600;
  padding:11px 22px; border-radius:var(--radius-pill); z-index:9999;
  box-shadow:var(--shadow-md); backdrop-filter:blur(16px);
  transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  opacity:0; pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1;}

@media(max-width:560px){
  .inp-row{flex-direction:column;}
  .sync-bar{gap:8px;}
  .sub-text{font-size:1rem;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important;}}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">Oh<b>Player</b></div>
  <div class="nav-end">
    <div class="dark-toggle" onclick="document.body.classList.toggle('dark')" title="다크모드 전환"></div>
  </div>
</nav>

<div class="wrap">

  <!-- 영상 링크 입력 -->
  <div class="card">
    <div class="card-title">구글 드라이브 영상 링크</div>
    <div class="inp-row">
      <input class="inp" type="text" id="drive-url"
        placeholder="https://drive.google.com/file/d/…/view"
        onkeydown="if(event.key==='Enter')loadVideo()">
      <button class="btn accent" onclick="loadVideo()">재생</button>
    </div>
    <p class="hint">파일 공유 설정이 <strong>링크가 있는 모든 사용자</strong>여야 합니다.</p>
    <div class="err" id="err"></div>
  </div>

  <!-- 자막 추가 -->
  <div class="card">
    <div class="card-title">자막 파일 추가 <span class="badge muted">.vtt / .srt</span></div>
    <div class="inp-row">
      <input class="inp narrow" type="text" id="lang-name" placeholder="언어" value="한국어">
      <input class="inp" type="file" id="sub-file" accept=".vtt,.srt">
      <button class="btn sm" onclick="addSubtitle()">추가</button>
    </div>
    <div class="sub-list" id="sub-list"></div>
  </div>

  <!-- 플레이어 -->
  <div id="player-section">

    <div class="card" style="padding:0;overflow:hidden;border-radius:var(--radius);">
      <div class="player-wrap">
        <iframe id="player-iframe" allowfullscreen allow="autoplay"></iframe>
        <div class="sub-overlay">
          <span class="sub-text" id="sub-display"></span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px;">
      <div class="card-title">자막 싱크 컨트롤</div>
      <div class="sync-bar">
        <span class="sync-time" id="sync-time">0:00.0</span>
        <div class="track-pills" id="track-pills">
          <button class="track-pill active" onclick="setTrack(-1,this)">자막 끄기</button>
        </div>
        <div style="display:flex;gap:6px;margin-left:auto;">
          <button class="btn sm icon-btn" title="−1초 되감기" onclick="adjustTime(-1)">−1s</button>
          <button class="btn sm accent icon-btn" id="sync-btn" onclick="toggleSync()">▶ 시작</button>
          <button class="btn sm icon-btn" title="+1초 앞으로" onclick="adjustTime(1)">+1s</button>
          <button class="btn sm ghost icon-btn" title="초기화" onclick="resetTimer()">↺</button>
        </div>
      </div>
      <p class="hint" style="margin-top:10px;">
        영상 재생과 동시에 <strong>▶ 시작</strong>을 누르면 자막이 싱크됩니다.
        타이밍이 맞지 않으면 −1s / +1s 로 조정하세요.
      </p>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── 상태 ─── */
const subtitles = [];   // {label, cues:[{start,end,text}]}
let activeTrack = -1;   // 현재 선택된 자막 인덱스
let elapsed = 0;        // 초 단위 타이머
let running = false;
let raf = null;
let lastTs = null;

/* ─── 유틸 ─── */
function showErr(msg){ const e=document.getElementById('err'); e.textContent=msg; e.classList.add('show'); }
function clearErr(){ document.getElementById('err').classList.remove('show'); }
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),2200);
}

function extractId(url){
  url=url.trim();
  let m;
  m=url.match(/\/file\/d\/([^/?&#]+)/); if(m)return m[1];
  m=url.match(/[?&]id=([^&]+)/); if(m)return m[1];
  if(/^[\w-]{20,}$/.test(url))return url;
  return null;
}

/* ─── 플레이어 ─── */
function loadVideo(){
  clearErr();
  const raw=document.getElementById('drive-url').value;
  const id=extractId(raw);
  if(!id){ showErr('유효한 구글 드라이브 링크를 입력해주세요.'); return; }

  const iframe=document.getElementById('player-iframe');
  // /preview 엔드포인트 → 구글 드라이브 자체 플레이어 (CORS 우회, 스트리밍 안정)
  iframe.src=`https://drive.google.com/file/d/${id}/preview`;

  document.getElementById('player-section').classList.add('visible');
  rebuildPills();
  resetTimer();
  document.getElementById('player-section').scrollIntoView({behavior:'smooth',block:'start'});
  toast('영상을 불러왔습니다.');
}

/* ─── 자막 파싱 ─── */
function parseSRT(text){
  const cues=[];
  const blocks=text.trim().split(/\n\s*\n/);
  for(const blk of blocks){
    const lines=blk.trim().split('\n');
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)continue;
    const [s,e]=lines[ti].split('-->').map(srtToSec);
    const txt=lines.slice(ti+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if(txt)cues.push({start:s,end:e,text:txt});
  }
  return cues;
}

function parseVTT(text){
  const cues=[];
  const blocks=text.replace(/^WEBVTT[^\n]*\n/,'').trim().split(/\n\s*\n/);
  for(const blk of blocks){
    const lines=blk.trim().split('\n');
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)continue;
    const [s,e]=lines[ti].split('-->').map(vttToSec);
    const txt=lines.slice(ti+1).join('\n').replace(/<[^>]+>/g,'').trim();
    if(txt)cues.push({start:s,end:e,text:txt});
  }
  return cues;
}

function srtToSec(s){
  s=s.trim().replace(',','.');
  const p=s.split(/[:.]/).map(Number);
  return p[0]*3600+p[1]*60+p[2]+p[3]/1000;
}
function vttToSec(s){
  s=s.trim();
  const p=s.split(/[:.]/).map(Number);
  if(p.length===4)return p[0]*3600+p[1]*60+p[2]+p[3]/1000;
  return p[0]*60+p[1]+p[2]/1000;
}

/* ─── 자막 추가 / 목록 ─── */
function addSubtitle(){
  const file=document.getElementById('sub-file').files[0];
  if(!file){ toast('자막 파일을 선택해주세요.'); return; }
  const label=document.getElementById('lang-name').value.trim()||file.name;

  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const cues=file.name.endsWith('.srt')?parseSRT(text):parseVTT(text);
    if(!cues.length){ toast('자막 파싱 실패: 지원 형식(.vtt/.srt) 확인'); return; }
    subtitles.push({label,cues});
    document.getElementById('sub-file').value='';
    renderSubList();
    rebuildPills();
    toast(`"${label}" 자막이 추가되었습니다 (${cues.length}개 큐)`);
  };
  reader.readAsText(file,'UTF-8');
}

function removeSubtitle(i){
  subtitles.splice(i,1);
  if(activeTrack===i)setTrack(-1,null);
  else if(activeTrack>i)activeTrack--;
  renderSubList();
  rebuildPills();
}

function renderSubList(){
  const list=document.getElementById('sub-list');
  list.innerHTML='';
  subtitles.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sub-item'+(activeTrack===i?' is-active':'');
    d.innerHTML=`
      <span class="sub-label">📄 ${s.label} <span class="badge muted sub-active">재생 중</span></span>
      <span class="badge accent">${s.cues.length}큐</span>
      <button class="sub-rm" onclick="removeSubtitle(${i})" title="제거">✕</button>
    `;
    list.appendChild(d);
  });
}

/* ─── 트랙 선택 Pills ─── */
function rebuildPills(){
  const c=document.getElementById('track-pills');
  c.innerHTML='';
  const off=document.createElement('button');
  off.className='track-pill'+(activeTrack===-1?' active':'');
  off.textContent='자막 끄기';
  off.onclick=()=>setTrack(-1,off);
  c.appendChild(off);
  subtitles.forEach((s,i)=>{
    const btn=document.createElement('button');
    btn.className='track-pill'+(activeTrack===i?' active':'');
    btn.textContent=s.label;
    btn.onclick=()=>setTrack(i,btn);
    c.appendChild(btn);
  });
}

function setTrack(i,btn){
  activeTrack=i;
  document.querySelectorAll('.track-pill').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('sub-display').textContent='';
  renderSubList();
}

/* ─── 타이머 (자막 싱크) ─── */
function toggleSync(){
  if(running){ pauseTimer(); } else { startTimer(); }
}

function startTimer(){
  running=true;
  lastTs=performance.now();
  document.getElementById('sync-btn').textContent='⏸ 일시정지';
  tick();
}

function pauseTimer(){
  running=false;
  if(raf){cancelAnimationFrame(raf);raf=null;}
  document.getElementById('sync-btn').textContent='▶ 시작';
}

function resetTimer(){
  pauseTimer();
  elapsed=0;
  updateTimerDisplay();
  document.getElementById('sub-display').textContent='';
}

function adjustTime(delta){
  elapsed=Math.max(0,elapsed+delta);
  updateTimerDisplay();
  renderSubtitle();
}

function tick(){
  if(!running)return;
  const now=performance.now();
  elapsed+=(now-lastTs)/1000;
  lastTs=now;
  updateTimerDisplay();
  renderSubtitle();
  raf=requestAnimationFrame(tick);
}

function updateTimerDisplay(){
  const m=Math.floor(elapsed/60);
  const s=(elapsed%60).toFixed(1).padStart(4,'0');
  document.getElementById('sync-time').textContent=`${m}:${s}`;
}

function renderSubtitle(){
  if(activeTrack<0||!subtitles[activeTrack]){
    document.getElementById('sub-display').textContent='';
    return;
  }
  const cues=subtitles[activeTrack].cues;
  const cur=cues.find(c=>elapsed>=c.start&&elapsed<c.end);
  document.getElementById('sub-display').textContent=cur?cur.text:'';
}
</script>
