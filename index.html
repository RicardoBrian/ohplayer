<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OhPlayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:
    radial-gradient(at 18% 18%, #e7ecff 0%, transparent 52%),
    radial-gradient(at 82% 12%, #ffe7f2 0%, transparent 46%),
    radial-gradient(at 65% 88%, #e0f5ff 0%, transparent 52%),
    radial-gradient(at 8% 92%, #eee6ff 0%, transparent 44%),
    #f4f5fa;
  --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.48);
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.78);
  --glass-nav:rgba(255,255,255,.62); --blur:saturate(180%) blur(22px);
  --text:#1a1c22; --text-2:#5b606b; --text-3:#8a8f99;
  --accent:#0071e3; --accent-light:rgba(0,113,227,.12);
  --accent-grad:linear-gradient(180deg,#3a9bff 0%,#0071e3 100%);
  --danger:#ff3b30; --danger-light:rgba(255,59,48,.12);
  --border:rgba(255,255,255,.55); --hairline:rgba(0,0,0,.06);
  --highlight:inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.4);
  --shadow-sm:0 2px 8px rgba(40,60,130,.08); --shadow:0 10px 30px rgba(40,60,130,.12);
  --shadow-md:0 18px 50px rgba(40,60,130,.16);
  --radius:20px; --radius-sm:13px; --radius-pill:980px; --nav-h:56px;
  --ease:cubic-bezier(.4,0,.2,1); --dur:.26s;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
}
body.dark{
  --bg:
    radial-gradient(at 18% 18%, #1b2444 0%, transparent 55%),
    radial-gradient(at 82% 12%, #2c1a44 0%, transparent 48%),
    radial-gradient(at 65% 90%, #0e2438 0%, transparent 52%),
    radial-gradient(at 8% 92%, #1a1530 0%, transparent 46%),
    #07080d;
  --surface:rgba(44,46,58,.58); --surface-2:rgba(58,60,74,.46);
  --glass:rgba(40,42,54,.52); --glass-strong:rgba(54,56,70,.78); --glass-nav:rgba(20,21,28,.62);
  --text:#f2f4f8; --text-2:#aab0bd; --text-3:#7e848f;
  --accent:#0a84ff; --accent-light:rgba(10,132,255,.18);
  --accent-grad:linear-gradient(180deg,#2b95ff 0%,#0a84ff 100%);
  --danger:#ff453a; --danger-light:rgba(255,69,58,.18);
  --border:rgba(255,255,255,.14); --hairline:rgba(255,255,255,.08);
  --highlight:inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 .5px rgba(255,255,255,.06);
  --shadow-sm:0 2px 8px rgba(0,0,0,.4); --shadow:0 10px 30px rgba(0,0,0,.5);
  --shadow-md:0 18px 50px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg); background-attachment:fixed; color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.5; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}

/* ── Nav ── */
.nav{
  position:sticky; top:0; z-index:200; height:var(--nav-h);
  display:flex; align-items:center; gap:12px; padding:0 20px;
  background:var(--glass-nav); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--hairline); box-shadow:0 1px 0 rgba(255,255,255,.4);
}
.brand{font-weight:800; font-size:1.05rem; letter-spacing:-.02em;}
.brand b{background:var(--accent-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.nav-end{margin-left:auto; display:flex; align-items:center; gap:10px;}
.dark-toggle{
  width:44px; height:26px; border-radius:var(--radius-pill);
  background:var(--glass-strong); border:1px solid var(--border);
  cursor:pointer; position:relative; transition:background var(--dur) var(--ease);
  box-shadow:var(--highlight); flex-shrink:0;
}
body.dark .dark-toggle{background:var(--accent); border-color:transparent;}
.dark-toggle::after{
  content:''; position:absolute; top:2px; left:2px; width:20px; height:20px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform var(--dur) var(--ease);
}
body.dark .dark-toggle::after{transform:translateX(18px);}

/* ── Layout ── */
.wrap{max-width:860px; margin:0 auto; padding:28px 20px 80px;}
.card{
  background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border); border-radius:var(--radius); padding:22px;
  box-shadow:var(--highlight),var(--shadow);
}
.card+.card{margin-top:14px;}
.card-title{font-size:.75rem; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px;}

/* ── Button ── */
.btn{
  font-family:inherit; font-size:.9rem; font-weight:600; cursor:pointer;
  border-radius:var(--radius-pill); padding:10px 20px;
  border:1px solid var(--border); background:var(--glass); color:var(--text);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--highlight),var(--shadow-sm);
  transition:background var(--dur) var(--ease), transform .08s, filter var(--dur) var(--ease);
  white-space:nowrap;
}
.btn:hover{background:var(--glass-strong);}
.btn:active{transform:scale(.97);}
.btn.accent{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:var(--highlight),0 6px 18px rgba(0,113,227,.35);}
.btn.accent:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent; box-shadow:none; backdrop-filter:none;}
.btn.ghost:hover{background:var(--accent-light); color:var(--accent);}
.btn.sm{padding:6px 14px; font-size:.82rem;}

/* ── Input ── */
.inp-row{display:flex; gap:8px; align-items:stretch;}
.inp{
  flex:1; padding:11px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--glass-strong);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  color:var(--text); font-family:inherit; font-size:.95rem; outline:none;
  box-shadow:var(--highlight);
  transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.inp::placeholder{color:var(--text-3);}
.inp:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-light);}
.inp.narrow{flex:0 0 96px;}
input[type="file"].inp{cursor:pointer; padding:8px 12px; font-size:.85rem;}
input[type="file"].inp::file-selector-button{
  background:var(--glass); border:1px solid var(--border); border-radius:8px;
  color:var(--text-2); cursor:pointer; font-size:.78rem; margin-right:8px; padding:4px 10px;
  font-family:inherit;
}

/* ── Badge ── */
.badge{display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:var(--radius-pill);}
.badge.accent{background:var(--accent-light); color:var(--accent);}
.badge.muted{background:var(--hairline); color:var(--text-3);}

/* ── Sub list ── */
.sub-list{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
.sub-item{
  display:flex; align-items:center; gap:10px;
  background:var(--surface-2); border:1px solid var(--hairline);
  border-radius:var(--radius-sm); padding:8px 12px; font-size:.85rem;
}
.sub-item .lbl{flex:1; color:var(--text-2); font-weight:500;}
.sub-rm{background:none; border:none; color:var(--text-3); cursor:pointer; font-size:1rem; padding:0 2px; transition:color var(--dur);}
.sub-rm:hover{color:var(--danger);}

/* ── Track pills ── */
.track-pills{display:flex; gap:6px; flex-wrap:wrap;}
.pill{
  font-size:.8rem; font-weight:600; padding:5px 14px;
  border-radius:var(--radius-pill); border:1px solid var(--border);
  background:var(--glass); color:var(--text-2); cursor:pointer;
  transition:all var(--dur) var(--ease);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
}
.pill:hover{background:var(--glass-strong); color:var(--text);}
.pill.active{background:var(--accent-grad); color:#fff; border-color:transparent; box-shadow:0 3px 10px rgba(0,113,227,.3);}

/* ── Hint / Error ── */
.hint{font-size:.78rem; color:var(--text-3); margin-top:8px; line-height:1.6;}
.hint strong{color:var(--text-2);}
.err{background:var(--danger-light); border:1px solid rgba(255,59,48,.2); border-radius:var(--radius-sm); color:var(--danger); font-size:.85rem; padding:10px 14px; margin-top:10px; display:none;}
.err.show{display:block;}

/* ════════════════════════════════════
   PLAYER — 핵심: 컨테이너를 전체화면
   ════════════════════════════════════ */
#player-section{display:none; margin-top:14px;}
#player-section.visible{display:block;}

/* 전체화면 대상 컨테이너 */
.player-fs-wrap{
  position:relative; width:100%; padding-bottom:56.25%;
  background:#000; border-radius:var(--radius);
  overflow:hidden; box-shadow:var(--shadow-md);
}

/* 전체화면 상태 */
.player-fs-wrap:fullscreen,
.player-fs-wrap:-webkit-full-screen{
  padding-bottom:0; width:100vw; height:100vh;
  border-radius:0;
}

.player-fs-wrap iframe{
  position:absolute; inset:0; width:100%; height:100%; border:none;
  /* iframe 자체 전체화면 버튼을 막기 위해 allowfullscreen 미부여 */
}

/* 자막 오버레이 — 전체화면에서도 iframe 위에 표시됨 */
.sub-overlay{
  position:absolute; bottom:72px; left:50%; transform:translateX(-50%);
  width:92%; max-width:760px; text-align:center;
  pointer-events:none; z-index:10;
  transition:opacity .2s;
}
.sub-text{
  display:inline-block; max-width:100%;
  background:rgba(0,0,0,.75); color:#fff;
  font-size:1.2rem; font-weight:500; line-height:1.6;
  padding:6px 20px; border-radius:10px;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  white-space:pre-wrap; word-break:keep-all;
}
.sub-text:empty{display:none;}

/* 전체화면 내부 HUD (자막 + 싱크 컨트롤) */
.fs-hud{
  position:absolute; bottom:0; left:0; right:0;
  padding:0 20px 16px;
  background:linear-gradient(transparent, rgba(0,0,0,.55) 60%);
  opacity:0; transition:opacity .3s var(--ease);
  z-index:20;
  /* 전체화면 아닐 때는 숨김 */
  display:none;
}
.player-fs-wrap:fullscreen .fs-hud,
.player-fs-wrap:-webkit-full-screen .fs-hud{display:block;}
.player-fs-wrap:fullscreen:hover .fs-hud,
.player-fs-wrap:-webkit-full-screen:hover .fs-hud{opacity:1;}

.fs-hud .sub-overlay{
  position:static; transform:none; width:100%;
  margin-bottom:12px; text-align:center;
}

/* 전체화면일 때 메인 오버레이 숨기고 HUD 안 오버레이만 */
.player-fs-wrap:fullscreen > .sub-overlay,
.player-fs-wrap:-webkit-full-screen > .sub-overlay{display:none;}

.hud-controls{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.hud-time{
  font-size:1rem; font-weight:700; letter-spacing:.02em;
  font-variant-numeric:tabular-nums; color:#fff; min-width:64px;
  text-shadow:0 1px 3px rgba(0,0,0,.8);
}
.hud-pills{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
.hud-pill{
  font-size:.75rem; font-weight:600; padding:4px 12px;
  border-radius:var(--radius-pill); border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12); color:rgba(255,255,255,.85); cursor:pointer;
  backdrop-filter:blur(8px); transition:all .2s;
}
.hud-pill:hover{background:rgba(255,255,255,.25);}
.hud-pill.active{background:var(--accent); border-color:transparent; color:#fff;}

.hud-btn{
  font-size:.8rem; font-weight:700; padding:5px 12px;
  border-radius:var(--radius-pill); border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12); color:#fff; cursor:pointer;
  backdrop-filter:blur(8px); transition:all .2s;
}
.hud-btn:hover{background:rgba(255,255,255,.25);}
.hud-btn.play{background:rgba(10,132,255,.7); border-color:transparent;}
.hud-btn.play:hover{background:rgba(10,132,255,.9);}

/* 전체화면 버튼 (항상 표시) */
.fs-btn{
  position:absolute; top:12px; right:12px; z-index:15;
  width:36px; height:36px; border-radius:50%;
  background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2);
  color:#fff; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(8px);
  transition:background .2s, opacity .2s;
  opacity:.6;
}
.fs-btn:hover{opacity:1; background:rgba(0,0,0,.65);}

/* ── 싱크바 (전체화면 밖) ── */
.sync-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:0; padding:14px 18px;
  background:var(--surface-2); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border:1px solid var(--hairline); border-radius:var(--radius-sm);
}
.sync-time{
  font-size:1.15rem; font-weight:700; letter-spacing:.02em;
  font-variant-numeric:tabular-nums; color:var(--accent); min-width:66px;
}
.sync-actions{display:flex; gap:6px; margin-left:auto;}

/* ── Toast ── */
.toast{
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(28,28,30,.82); color:#fff; font-size:.88rem; font-weight:600;
  padding:11px 22px; border-radius:var(--radius-pill); z-index:9999;
  box-shadow:var(--shadow-md); backdrop-filter:blur(16px);
  transition:transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
  opacity:0; pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1;}

@media(max-width:560px){
  .inp-row{flex-direction:column;}
  .sub-text{font-size:1rem;}
  .sync-actions{flex-wrap:wrap;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<nav class="nav">
  <div class="brand">Oh<b>Player</b></div>
  <div class="nav-end">
    <div class="dark-toggle" onclick="document.body.classList.toggle('dark')" title="다크모드 전환"></div>
  </div>
</nav>

<div class="wrap">

  <!-- 링크 입력 -->
  <div class="card">
    <div class="card-title">구글 드라이브 영상 링크</div>
    <div class="inp-row">
      <input class="inp" type="text" id="drive-url"
        placeholder="https://drive.google.com/file/d/…/view"
        onkeydown="if(event.key==='Enter')loadVideo()">
      <button class="btn accent" onclick="loadVideo()">재생</button>
    </div>
    <p class="hint">파일 공유 설정이 <strong>링크가 있는 모든 사용자</strong>여야 합니다.</p>
    <div class="err" id="err"></div>
  </div>

  <!-- 자막 추가 -->
  <div class="card">
    <div class="card-title">자막 파일 <span class="badge muted">.vtt · .srt</span></div>
    <div class="inp-row">
      <input class="inp narrow" type="text" id="lang-name" placeholder="언어" value="한국어">
      <input class="inp" type="file" id="sub-file" accept=".vtt,.srt">
      <button class="btn sm" onclick="addSubtitle()">추가</button>
    </div>
    <div class="sub-list" id="sub-list"></div>
    <p class="hint" style="margin-top:10px;">자막 선택 후 영상 재생과 동시에 <strong>▶ 시작</strong>을 누르면 싱크됩니다.</p>
  </div>

  <!-- 플레이어 -->
  <div id="player-section">

    <div class="card" style="padding:0;overflow:hidden;">
      <!-- 전체화면 대상: 이 div를 fullscreen으로 만들어야 자막이 같이 뜸 -->
      <div class="player-fs-wrap" id="player-fs-wrap">

        <iframe id="player-iframe"
          allow="autoplay; encrypted-media"
          sandbox="allow-scripts allow-same-origin allow-presentation allow-popups">
        </iframe>

        <!-- 일반 모드 자막 오버레이 -->
        <div class="sub-overlay" id="sub-overlay-main">
          <span class="sub-text" id="sub-display-main"></span>
        </div>

        <!-- 전체화면 HUD (hover 시 표시) -->
        <div class="fs-hud" id="fs-hud">
          <div class="sub-overlay">
            <span class="sub-text" id="sub-display-fs"></span>
          </div>
          <div class="hud-controls">
            <span class="hud-time" id="hud-time">0:00</span>
            <div class="hud-pills" id="hud-pills"></div>
            <button class="hud-btn" onclick="adjustTime(-1)">−1s</button>
            <button class="hud-btn play" id="hud-play-btn" onclick="toggleSync()">▶</button>
            <button class="hud-btn" onclick="adjustTime(1)">+1s</button>
            <button class="hud-btn" onclick="resetTimer()" title="초기화">↺</button>
            <button class="hud-btn" onclick="exitFs()" title="전체화면 종료">✕</button>
          </div>
        </div>

        <!-- 전체화면 진입 버튼 -->
        <button class="fs-btn" onclick="enterFs()" title="전체화면">⛶</button>

      </div>
    </div>

    <!-- 일반 모드 싱크바 -->
    <div class="card" style="margin-top:14px;">
      <div class="card-title">자막 싱크</div>
      <div class="sync-bar">
        <span class="sync-time" id="sync-time">0:00.0</span>
        <div class="track-pills" id="track-pills">
          <button class="pill active" onclick="setTrack(-1,this)">자막 끄기</button>
        </div>
        <div class="sync-actions">
          <button class="btn sm ghost" onclick="adjustTime(-1)">−1s</button>
          <button class="btn sm accent" id="sync-btn" onclick="toggleSync()">▶ 시작</button>
          <button class="btn sm ghost" onclick="adjustTime(1)">+1s</button>
          <button class="btn sm ghost" onclick="resetTimer()">↺</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 상태 ── */
const subtitles = [];
let activeTrack = -1;
let elapsed = 0;
let running = false;
let raf = null;
let lastTs = null;

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
function showErr(m){ const e=$('err'); e.textContent=m; e.classList.add('show'); }
function clearErr(){ $('err').classList.remove('show'); }
function toast(m){
  const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function extractId(url){
  url=url.trim();
  let m;
  m=url.match(/\/file\/d\/([^/?&#]+)/); if(m)return m[1];
  m=url.match(/[?&]id=([^&]+)/); if(m)return m[1];
  if(/^[\w-]{20,}$/.test(url))return url;
  return null;
}

/* ── 영상 로드 ── */
function loadVideo(){
  clearErr();
  const raw=$('drive-url').value;
  const id=extractId(raw);
  if(!id){ showErr('유효한 구글 드라이브 링크를 입력하세요.'); return; }
  $('player-iframe').src=`https://drive.google.com/file/d/${id}/preview`;
  $('player-section').classList.add('visible');
  rebuildPills();
  resetTimer();
  $('player-section').scrollIntoView({behavior:'smooth', block:'start'});
  toast('영상을 불러왔습니다.');
}

/* ── 자막 파싱 ── */
function srtToSec(s){
  s=s.trim().replace(',','.');
  const p=s.split(/[:.]/).map(Number);
  return p[0]*3600+p[1]*60+p[2]+p[3]/1000;
}
function vttToSec(s){
  s=s.trim(); const p=s.split(/[:.]/).map(Number);
  return p.length===4 ? p[0]*3600+p[1]*60+p[2]+p[3]/1000 : p[0]*60+p[1]+p[2]/1000;
}
function parseSRT(text){
  return text.trim().split(/\n\s*\n/).map(blk=>{
    const lines=blk.trim().split('\n');
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)return null;
    const [s,e]=lines[ti].split('-->').map(srtToSec);
    const txt=lines.slice(ti+1).join('\n').replace(/<[^>]+>/g,'').trim();
    return txt?{start:s,end:e,text:txt}:null;
  }).filter(Boolean);
}
function parseVTT(text){
  return text.replace(/^WEBVTT[^\n]*/,'').trim().split(/\n\s*\n/).map(blk=>{
    const lines=blk.trim().split('\n');
    const ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)return null;
    const [s,e]=lines[ti].split('-->').map(vttToSec);
    const txt=lines.slice(ti+1).join('\n').replace(/<[^>]+>/g,'').trim();
    return txt?{start:s,end:e,text:txt}:null;
  }).filter(Boolean);
}

/* ── 자막 추가 ── */
function addSubtitle(){
  const file=$('sub-file').files[0];
  if(!file){ toast('자막 파일을 선택하세요.'); return; }
  const label=$('lang-name').value.trim()||file.name;
  const reader=new FileReader();
  reader.onload=e=>{
    const cues=file.name.endsWith('.srt')?parseSRT(e.target.result):parseVTT(e.target.result);
    if(!cues.length){ toast('자막 파싱 실패. 파일을 확인하세요.'); return; }
    subtitles.push({label,cues});
    $('sub-file').value='';
    renderSubList();
    rebuildPills();
    toast(`"${label}" 추가됨 (${cues.length}큐)`);
  };
  reader.readAsText(file,'UTF-8');
}

function removeSubtitle(i){
  subtitles.splice(i,1);
  if(activeTrack===i)setTrack(-1,null);
  else if(activeTrack>i)activeTrack--;
  renderSubList(); rebuildPills();
}

function renderSubList(){
  const list=$('sub-list'); list.innerHTML='';
  subtitles.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sub-item';
    d.innerHTML=`<span class="lbl">📄 ${s.label}</span><span class="badge accent">${s.cues.length}큐</span><button class="sub-rm" onclick="removeSubtitle(${i})">✕</button>`;
    list.appendChild(d);
  });
}

/* ── 트랙 선택 ── */
function rebuildPills(){
  ['track-pills','hud-pills'].forEach(id=>{
    const c=$(id); if(!c)return;
    c.innerHTML='';
    const isHud=id==='hud-pills';
    const mk=(label,idx)=>{
      const b=document.createElement('button');
      b.className=(isHud?'hud-pill':'pill')+(activeTrack===idx?' active':'');
      b.textContent=label;
      b.onclick=()=>setTrack(idx,b,isHud);
      return b;
    };
    c.appendChild(mk('자막 끄기',-1));
    subtitles.forEach((s,i)=>c.appendChild(mk(s.label,i)));
  });
}

function setTrack(i, btn, isHud){
  activeTrack=i;
  // 양쪽 pill 모두 active 갱신
  document.querySelectorAll('.pill,.hud-pill').forEach(b=>b.classList.remove('active'));
  // 같은 인덱스 버튼 모두 활성화
  document.querySelectorAll('.pill,.hud-pill').forEach(b=>{
    if(b.textContent===(i===-1?'자막 끄기':subtitles[i]?.label))b.classList.add('active');
  });
  $('sub-display-main').textContent='';
  $('sub-display-fs').textContent='';
}

/* ── 타이머 ── */
function toggleSync(){
  running?pauseTimer():startTimer();
}
function startTimer(){
  running=true; lastTs=performance.now();
  $('sync-btn').textContent='⏸ 일시정지';
  $('hud-play-btn').textContent='⏸';
  tick();
}
function pauseTimer(){
  running=false; if(raf){cancelAnimationFrame(raf);raf=null;}
  $('sync-btn').textContent='▶ 시작';
  $('hud-play-btn').textContent='▶';
}
function resetTimer(){
  pauseTimer(); elapsed=0; updateDisplay(); clearSubs();
}
function adjustTime(d){
  elapsed=Math.max(0,elapsed+d); updateDisplay(); renderSubtitle();
}
function tick(){
  if(!running)return;
  const now=performance.now();
  elapsed+=(now-lastTs)/1000; lastTs=now;
  updateDisplay(); renderSubtitle();
  raf=requestAnimationFrame(tick);
}
function updateDisplay(){
  const m=Math.floor(elapsed/60);
  const s=(elapsed%60).toFixed(1).padStart(4,'0');
  const txt=`${m}:${s}`;
  $('sync-time').textContent=txt;
  $('hud-time').textContent=txt;
}
function clearSubs(){
  $('sub-display-main').textContent='';
  $('sub-display-fs').textContent='';
}
function renderSubtitle(){
  if(activeTrack<0||!subtitles[activeTrack]){clearSubs();return;}
  const cur=subtitles[activeTrack].cues.find(c=>elapsed>=c.start&&elapsed<c.end);
  const txt=cur?cur.text:'';
  $('sub-display-main').textContent=txt;
  $('sub-display-fs').textContent=txt;
}

/* ── 전체화면 ── */
function enterFs(){
  const el=$('player-fs-wrap');
  (el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen).call(el);
}
function exitFs(){
  (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen).call(document);
}

// 전체화면 변경 감지 → fs-btn 아이콘 토글
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
function onFsChange(){
  const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
  $('player-fs-wrap').querySelector('.fs-btn').textContent=isFs?'✕':'⛶';
  $('player-fs-wrap').querySelector('.fs-btn').onclick=isFs?exitFs:enterFs;
}

// 키보드 단축키
document.addEventListener('keydown', e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();toggleSync();}
  if(e.key==='ArrowLeft')adjustTime(-1);
  if(e.key==='ArrowRight')adjustTime(1);
  if(e.key==='r'||e.key==='R')resetTimer();
  if(e.key==='f'||e.key==='F'){
    const isFs=!!(document.fullscreenElement||document.webkitFullscreenElement);
    isFs?exitFs():enterFs();
  }
});
</script>
